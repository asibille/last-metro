version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dernier_metro_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dernier_metro_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dernier_metro_test
      DB_USER: app
      DB_PASSWORD: app
      NODE_ENV: test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
