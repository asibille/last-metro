version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lastmetro-db
    environment:
      POSTGRES_DB: dernier_metro
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dernier_metro"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata_test:/var/lib/postgresql/data
      - ./db/02_metro_lines.sql:/docker-entrypoint-initdb.d/02_metro_lines.sql:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.ci
    container_name: lastmetro-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dernier_metro
      DB_USER: app
      DB_PASSWORD: app
      NODE_ENV: test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata_test:
