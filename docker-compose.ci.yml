version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lastmetro-db
    environment:
      POSTGRES_DB: dernier_metro
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dernier_metro"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
    container_name: lastmetro-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dernier_metro
      DB_USER: app
      DB_PASSWORD: app
      NODE_ENV: test
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "sleep 5 && npm test"

volumes:
  pgdata:
