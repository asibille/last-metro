name: CI/CD - LastMetro API

on:
  push:
    branches: ["main", "develop", "12-ci/cd"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}
  IMAGE_LATEST: ghcr.io/${{ github.repository }}:latest

jobs:
  # ==========================================
  # BUILD & PUSH IMAGE
  # ==========================================
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.ci -t $IMAGE_NAME -t $IMAGE_LATEST .
          docker push $IMAGE_NAME
          docker push $IMAGE_LATEST

  # ==========================================
  # UNIT + INTEGRATION TESTS via Docker Compose
  # ==========================================
  tests:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Start services & run tests
        run: |
          docker-compose -f docker-compose.ci.yml up --build --abort-on-container-exit

      - name: Shutdown services and remove volumes
        run: docker-compose -f docker-compose.ci.yml down -v

  # ==========================================
  # SECURITY SCAN
  # ==========================================
  trivy-scan:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: image
          severity: HIGH,CRITICAL
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          exit-code: 1

  # ==========================================
  # DEPLOY STAGING
  # ==========================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [tests, trivy-scan]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Simulate deploy staging
        run: echo "Deploying $IMAGE_NAME to staging..."

  # ==========================================
  # DEPLOY PRODUCTION
  # ==========================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [tests, trivy-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Simulate deploy production
        run: echo "Deploying $IMAGE_NAME to production..."
