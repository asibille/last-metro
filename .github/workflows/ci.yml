name: CI/CD - LastMetro API

on:
  push:
    branches: ["main", "develop", "12-ci/cd"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}
  IMAGE_LATEST: ghcr.io/${{ github.repository }}:latest

jobs:
  # ==========================================
  # STAGE 1 : BUILD & PUSH DOCKER IMAGE
  # ==========================================
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME -t $IMAGE_LATEST .
          echo "Image built: $IMAGE_NAME"

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME
          docker push $IMAGE_LATEST
          echo "Docker image pushed"

  # ==========================================
  # STAGE 2 : UNIT TESTS
  # ==========================================
  unit-tests:
   runs-on: ubuntu-latest
   needs: build-image
   services:
    postgres:
      image: postgres:16-alpine
      ports: ["5432:5432"]
      env:
        POSTGRES_DB: dernier_metro_test
        POSTGRES_USER: app
        POSTGRES_PASSWORD: app
      options: >-
        --health-cmd="pg_isready -U app" 
        --health-interval=5s 
        --health-timeout=5s 
        --health-retries=10

  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Wait for Postgres
      run: |
        for i in $(seq 1 30); do
          pg_isready -h localhost -p 5432 -U app && break
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: dernier_metro_test
        DB_USER: app
        DB_PASSWORD: app
      run: npm test
  # ==========================================
  # STAGE 3 : INTEGRATION TESTS
  # ==========================================
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install docker-compose -y

      - name: Start services
        run: |
          docker-compose -f docker-compose.ci.yml up -d
          echo "Waiting for Postgres to be healthy..."
          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' lastmetro-db)
            echo "Postgres health: $STATUS"
            if [ "$STATUS" == "healthy" ]; then break; fi
            sleep 2
          done

      - name: Run integration tests inside API container
        run: docker-compose -f docker-compose.ci.yml exec -T api npm test

      - name: Shutdown services
        run: docker-compose -f docker-compose.ci.yml down

  # ==========================================
  # STAGE 4 : SECURITY (Trivy)
  # ==========================================
  trivy-scan:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Install Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: image
          severity: HIGH,CRITICAL
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          exit-code: 1

  # ==========================================
  # STAGE 5 : DEPLOY STAGING
  # ==========================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, trivy-scan]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging with image $IMAGE_NAME"
          echo "Configure your real deployment here"

  # ==========================================
  # STAGE 6 : DEPLOY PRODUCTION
  # ==========================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, trivy-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production with image $IMAGE_NAME"
          echo "Configure your real deployment here"
