name: CI/CD - LastMetro API

on:
  push:
    branches: ["main", "develop", "12-ci/cd"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/asibille/last-metro:${{ github.sha }}
  IMAGE_LATEST: ghcr.io/asibille/last-metro:latest

jobs:
  # ==========================================
  # STAGE 1 : BUILD & PUSH IMAGE
  # ==========================================
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}  # <- utilise ton Personal Access Token ici

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME -t $IMAGE_LATEST .
          docker push $IMAGE_NAME
          docker push $IMAGE_LATEST

  # ==========================================
  # STAGE 2 : UNIT TESTS
  # ==========================================
  unit-tests:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # ==========================================
  # STAGE 3 : INTEGRATION TESTS
  # ==========================================
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install docker-compose -y
      - name: Start services
        run: |
          docker-compose up -d
          echo "Waiting for Postgres to be healthy..."
          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' lastmetro-db)
            echo "Postgres health: $STATUS"
            if [ "$STATUS" == "healthy" ]; then break; fi
            sleep 2
          done
      - name: Run integration tests inside API container
        run: docker-compose exec -T api npm test
      - name: Shutdown services
        run: docker-compose down

  # ==========================================
  # STAGE 4 : SECURITY SCAN (Trivy)
  # ==========================================
  trivy-scan:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: image
          severity: HIGH,CRITICAL
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          exit-code: 1

  # ==========================================
  # STAGE 5 : DEPLOY STAGING
  # ==========================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, trivy-scan]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging with image $IMAGE_NAME"
          echo "Configure your deployment here"

  # ==========================================
  # STAGE 6 : DEPLOY PRODUCTION
  # ==========================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, trivy-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production with image $IMAGE_NAME"
          echo "Configure your deployment here"
