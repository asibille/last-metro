name: CI/CD - LastMetro API

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}
  IMAGE_LATEST: ghcr.io/${{ github.repository }}:latest

jobs:

  # ==========================================
  # STAGE 1 : BUILD
  # ==========================================
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME -t $IMAGE_LATEST .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME
          docker push $IMAGE_LATEST

  # ==========================================
  # STAGE 2 : UNIT TESTS
  # ==========================================
  unit-tests:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci
      - run: npm test

  # ==========================================
  # STAGE 3 : INTEGRATION TESTS
  # ==========================================
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-image

    # PostgreSQL fourni par GitHub Actions
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dernier_metro
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: dernier_metro
      DB_USER: app
      DB_PASSWORD: app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm test

  # ==========================================
  # STAGE 4 : SECURITY SCAN
  # ==========================================
  trivy-scan:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: image
          severity: HIGH,CRITICAL
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          exit-code: 1

# ==========================================
# STAGE 5 : DEPLOYMENT (simulé)
# ==========================================
deploy-staging:
  runs-on: ubuntu-latest
  needs: [unit-tests, integration-tests, trivy-scan]
  if: github.ref == 'refs/heads/develop'
  steps:
    - run: |
        echo "🚀 Deploying to staging with image $IMAGE_NAME"
        echo "Configure your real deployment here."

deploy-production:
  runs-on: ubuntu-latest
  needs: [unit-tests, integration-tests, trivy-scan]
  if: github.ref == 'refs/heads/main'
  steps:
    - run: |
        echo "🚀 Deploying to production with image $IMAGE_NAME"
        echo "Configure your real deployment here."